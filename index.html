<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U.S. Election Simulator</title>
<style>
:root{--n:#1f2a44;--y:#ffc000;--b:#1d5fd1}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f3f5f9;color:#111}
header{background:var(--n);border-top:6px solid var(--y);color:#fff;padding:10px 16px}h1{margin:0 0 8px;font-size:22px;text-align:center}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}nav button,.btn{background:#eaf0fb;color:var(--b);border:0;border-radius:4px;padding:6px 12px;font-weight:700;cursor:pointer}nav button.on{background:var(--y);color:#000}
main{max-width:1150px;margin:12px auto;padding:0 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar label{font-size:11px;font-weight:700;color:#555;display:flex;flex-direction:column;gap:2px}
input,select{font:inherit;padding:4px;border:1px solid #999;border-radius:3px;background:#fff8d6;color:#00f;max-width:100%}input[type=number]{width:105px}input.w{width:150px}
.grid{display:grid;grid-template-columns:minmax(330px,1fr) minmax(330px,1fr);gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card,.box{background:#fff;padding:12px;border-radius:6px;box-shadow:0 1px 3px #0002}.card h2{margin:0;font-size:26px}.tag{display:inline-block;background:var(--n);color:#fff;font-weight:700;padding:3px 14px;margin:6px 0}
.row{display:flex;align-items:center;gap:8px;padding:5px;margin:6px 0;border-bottom:1px solid #ddd}.row.win{outline:4px solid var(--y);border-bottom:0}
.chip{width:26px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:#fff}.nm{flex:1;line-height:1.05}.nm small{display:block;color:#777;font-size:11px;font-weight:700}.nm strong{font-size:20px}
.inc{background:#d01f1f;color:#fff;font-size:9px;font-weight:700;padding:2px 5px}.ahead{color:#777;font-size:11px;font-weight:700}.votes{font-weight:700;font-size:17px;min-width:80px;text-align:right}
.pct{width:78px;text-align:center;color:#fff;font-weight:700;font-size:20px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.rep{color:#2e8b57;font-weight:700;font-family:monospace}.ban{background:#ffe699;border:3px solid var(--y);padding:8px;text-align:center;font-weight:700;margin:8px 0}.sm{color:#666;font-size:12px}
.map{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#fff;border:1px solid #ccc;color:#000}
.lg{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.lg span{padding:3px 9px;color:#fff;font-weight:700;font-size:12px}
.bars div{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}.bars i{display:block;height:14px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th{background:var(--n);color:#fff;padding:6px;position:sticky;top:0}td{border:1px solid #ddd;padding:3px 5px}.sc{overflow:auto;max-height:70vh}
.pp{color:#fff;font-weight:700;text-align:center}.x{border:0;background:#fdd;cursor:pointer}
</style></head><body><header><h1>U.S. ELECTION SIMULATOR</h1><nav id="nav"></nav></header><main id="app"></main>
<script>

const LAY="AK0,0;ME0,11;VT1,10;NH1,11;WA2,1;ID2,2;MT2,3;ND2,4;MN2,5;IL2,6;WI2,7;MI2,8;NY2,9;RI2,10;MA2,11;OR3,1;NV3,2;WY3,3;SD3,4;IA3,5;IN3,6;OH3,7;PA3,8;NJ3,9;CT3,10;CA4,1;UT4,2;CO4,3;NE4,4;MO4,5;KY4,6;WV4,7;VA4,8;MD4,9;DE4,10;AZ5,2;NM5,3;KS5,4;AR5,5;TN5,6;NC5,7;SC5,8;DC5,9;OK6,4;LA6,5;MS6,6;AL6,7;GA6,8;HI7,0;TX7,4;FL7,9";
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),F=n=>Math.round(n).toLocaleString();
function seed(){const st=RAW.split(';').map(r=>{const a=r.split(',');return{c:a[0],n:a[1],p:+a[2],m20:+a[3],m24:+a[4],ap:a[0]!='DC',ov:''}}),co=[],ca=[];let i=0;
const add=(lvl,s,jur,off,dist,bal,cs)=>{const id='C'+String(++i).padStart(3,'0');co.push({id,lvl,st:s,jur,off,dist,bal});cs.forEach(c=>ca.push({cid:id,name:c[0],party:c[1],inc:c[2],votes:c[3]}))};
add('Federal','MS','','US Senate','',982800,[['Scott Colom','D',0,467930],['Cindy Hyde-Smith','R',1,465356],['Ty Pinkins','I',0,20028]]);
st.forEach(s=>{const v=Math.round(s.p*.47),d=Math.round(v*(98+s.m24)/200),r=Math.round(v*(98-s.m24)/200);add('Federal',s.c,'','President','',v,[['Jordan Hale','D',0,d],['Casey Brandt','R',0,r],['Morgan Lee','I',0,v-d-r]])});
add('County','MS','Hinds County','County Sheriff','',118400,[['Alex Rivera (sample)','D',0,41200],['Jamie Cole (sample)','R',0,29850]]);
add('City','MS','Jackson','Mayor','',49200,[['Priya Shah (sample)','D',0,20110],['Dale Weston (sample)','R',1,18420],['Sam Ortiz (sample)','I',0,3320]]);
add('State','TX','','State Senate','District 5',263200,[['Maria Lopez (sample)','D',0,91000],['Tom Reed (sample)','R',0,98500]]);
add('Federal','TX','','US House','TX-12',458400,[['Kim Park (sample)','D',0,120300],['Rob Hayes (sample)','R',1,131800]]);
return{st,co,ca,nat:{a:4.5,b:-1.5},house:435,sw:{D:0,R:0,I:0,G:0,L:0,O:0},close:.5,off:'President,US Senate,US House,Governor,Attorney General,Secretary of State,State Senate,State House,Mayor,City Council,County Commissioner,County Sheriff,Ballot Measure',dm:{}}}
let db=JSON.parse(localStorage.getItem('uses_db')||'null')||seed(),ui={tab:'Dashboard',lvl:'All',st:'All',cid:'C001',layer:'President',ecid:'C001'},R={};
const save=()=>localStorage.setItem('uses_db',JSON.stringify(db)),offs=()=>db.off.split(',').map(s=>s.trim()).filter(Boolean);
const nm=s=>db.st.find(x=>x.c===s)?.n||s,lab=c=>`${c.st} | ${c.off}${c.dist?' '+c.dist:''}${c.jur?' - '+c.jur:''} [${c.id}]`;
function app(){const a=db.st.filter(s=>s.ap&&s.p>0),S={};a.forEach(s=>S[s.c]=1);let l=db.house-a.length;while(l-->0){let b=null,bp=-1;a.forEach(s=>{const n=S[s.c]+1,p=s.p/Math.sqrt(n*(n-1));if(p>bp){bp=p;b=s}});if(!b)break;S[b.c]++}return S}
const ev=(S,c)=>(S[c]||0)+(c==='DC'?3:2);
const pv=s=>s.ov!==''&&s.ov!=null?+s.ov:((s.m20-db.nat.a)+(s.m24-db.nat.b))/4,pl=v=>Math.abs(v)<.5?'EVEN':(v>0?'D+':'R+')+Math.round(Math.abs(v));
function cc(c){const cs=db.ca.filter(x=>x.cid===c.id),cnt=cs.reduce((a,x)=>a+(+x.votes||0),0),bal=+c.bal||0,tot=bal>0?Math.max(bal,cnt):cnt,rep=bal>0?Math.min(100,cnt/bal*100):(cnt>0?100:0),rem=Math.max(0,tot-cnt);
const L=cs.map(x=>({...x,v:+x.votes||0,sh:cnt?(+x.votes||0)/cnt*100:0})).sort((a,b)=>b.v-a.v);L.forEach(x=>x.adj=Math.max(0,x.sh+(+db.sw[x.party]||0)));const at=L.reduce((a,x)=>a+x.adj,0);
L.forEach(x=>{x.ps=at?x.adj/at*100:0;x.pvts=x.ps/100*tot});const P=[...L].sort((a,b)=>b.ps-a.ps),lead=L[0]?L[0].v-(L[1]?.v||0):0,mg=P[0]?P[0].ps-(P[1]?.ps||0):0;
const sd=rep>=100?'Final count':lead>rem?'Leader clinched':mg<db.close?'Too close to call':'Projected';
const d=db.dm[c.dist],ds=d&&d.a!==''&&d.b!==''&&d.a!=null&&d.b!=null,s=db.st.find(x=>x.c===c.st),pvi=ds?pl(((+d.a-db.nat.a)+(+d.b-db.nat.b))/4):s?pl(pv(s)):'';

const sel=(o,v,a='')=>`<select ${a}>${o.map(x=>{const[k,t]=Array.isArray(x)?x:[x,x];return`<option value="${E(k)}"${k==v?' selected':''}>${E(t)}</option>`}).join('')}</select>`;
const inp=(v,a,t='text')=>`<input type="${t}" value="${E(v)}" ${a}>`;
function leader(code,off){const m={};db.co.filter(c=>c.st===code&&c.off===off).forEach(c=>{const p=R[c.id]?.pw;if(p)m[p.party]=(m[p.party]||0)+1});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);return!e.length?'':e[1]&&e[1][1]===e[0][1]?'T':e[0][0]}
function dash(){const lv=['All','Federal','State','County','City'],sts=[['All','All'],...db.st.map(s=>[s.c,s.n])];
const list=db.co.filter(c=>(ui.lvl=='All'||c.lvl==ui.lvl)&&(ui.st=='All'||c.st==ui.st));if(!list.find(c=>c.id==ui.cid)&&list[0])ui.cid=list[0].id;
const c=db.co.find(x=>x.id==ui.cid),r=c&&R[c.id];let card='<div class="card">No contest matches the filters</div>';
if(c)card=`<div class="card"><h2>${E(r.loc.toUpperCase())}</h2><span class="tag">${E(c.off.toUpperCase()+(c.dist?' '+c.dist.toUpperCase():''))}</span> <span class="sm">${c.lvl}</span>
${r.L.slice(0,4).map((x,i)=>{const w=r.pw&&x.name==r.pw.name&&x.v==r.pw.v,p=x.name.split(' '),l=p.length>1?p.slice(1).join(' '):x.name;return`<div class="row${w?' win':''}"><b class="chip" style="background:${PC[x.party]||PC.O}">${x.party}</b><div class="nm"><small>${w?'★ ':''}${p.length>1?E(p[0].toUpperCase()):''}</small><strong>${E(l.toUpperCase())}</strong></div>${x.inc?'<span class="inc">INCUMBENT</span>':''}<span class="ahead">${i==0&&r.lead?F(r.lead)+' AHEAD':''}</span><span class="votes">${F(x.v)}</span><div class="pct" style="background:${PC[x.party]||PC.O}">${x.sh.toFixed(1)}%</div></div>`}).join('')}
<div class="rep">${'█'.repeat(Math.round(r.rep/5))+'░'.repeat(20-Math.round(r.rep/5))} ${r.rep.toFixed(1)}% of ballots counted</div>
<div class="ban">★ PROJECTED WINNER: ${E(r.pw?.name||'-')} (${PN[r.pw?.party]||''}) ${(r.pw?.ps||0).toFixed(1)}% | margin ${r.mg.toFixed(1)} pts | ${r.sd}</div>
<div class="sm">Counted ${F(r.cnt)} of ${F(r.tot)} ballots | ${F(r.rem)} left${r.pvi?' | Cook PVI '+r.pvi:''}${r.L.length>4?' | top 4 of '+r.L.length+' shown':''}</div>
<div class="bars" style="margin-top:8px">${r.L.slice(0,4).map(x=>`<div><span style="width:110px">${E(x.name)}</span><i style="width:${x.sh*2}px;background:#888"></i>${x.sh.toFixed(1)}%</div><div><span style="width:110px"></span><i style="width:${x.ps*2}px;background:${PC[x.party]||PC.O}"></i>${x.ps.toFixed(1)}% proj.</div>`).join('')}</div></div>`;
const S=app(),LY=LAY.split(';').map(t=>{const m=t.match(/^([A-Z]{2})(\d),(\d+)$/);return[m[1],+m[2],+m[3]]}),codes=new Set(LY.map(x=>x[0])),extra=db.st.filter(s=>!codes.has(s.c)),cell={};
const ld={};db.st.forEach(s=>ld[s.c]=leader(s.c,ui.layer));let tiles='';
for(let y=0;y<9;y++)for(let x=0;x<12;x++){let t=LY.find(a=>a[1]==y&&a[2]==x)?.[0];if(y==8)t=extra[x]?.c;tiles+=t?`<div class="t" title="${E(nm(t))}" style="${ld[t]?`background:${PC[ld[t]]};color:#fff`:''}">${t}</div>`:'<div></div>'}
const cnt={};Object.values(ld).forEach(p=>{if(p)cnt[p]=(cnt[p]||0)+1});const evs={};db.st.forEach(s=>{if(ld[s.c])evs[ld[s.c]]=(evs[ld[s.c]]||0)+ev(S,s.c)});
const mx=Math.max(1,...Object.values(cnt));
return`<div class="bar"><label>LEVEL${sel(lv,ui.lvl,'data-u="lvl"')}</label><label>STATE${sel(sts,ui.st,'data-u="st"')}</label><label>CONTEST${sel(list.map(x=>[x.id,lab(x)]),ui.cid,'data-u="cid"')}</label><label>MAP LAYER (OFFICE)${sel(offs(),ui.layer,'data-u="layer"')}</label></div>
<div class="grid">${card}<div class="box"><b>MAP: projected leader by state - ${E(ui.layer)}</b><div class="map" style="margin-top:6px">${tiles}</div><div class="lg">${Object.keys(PC).map(k=>`<span style="background:${PC[k]}">${k=='T'?'Tie':k}</span>`).join('')}<span style="background:#fff;color:#555;border:1px solid #ccc">No race</span></div>
<div class="sm" style="margin-top:6px">${ui.layer=='President'?'Electoral votes (apportionment calculator): '+['D','R','I'].map(k=>k+' '+(evs[k]||0)).join(' | '):'Tile = party leading most contests for this office in the state.'}</div>
<div class="bars" style="margin-top:8px"><b>States leading by party</b>${Object.keys(PC).filter(k=>cnt[k]).map(k=>`<div><span style="width:30px">${k}</span><i style="width:${cnt[k]/mx*200}px;background:${PC[k]}"></i>${cnt[k]}</div>`).join('')||'<span class="sm">none</span>'}</div></div></div>`}
function results(){const c=db.co.find(x=>x.id==ui.cid),r=c&&R[c.id];let d='';
if(r)d=`<div class="box"><h3>${E(lab(c))}</h3><p>Ballots expected <b>${F(r.tot)}</b> | counted <b>${F(r.cnt)}</b> | reporting <b>${r.rep.toFixed(1)}%</b> | left <b>${F(r.rem)}</b> | lead <b>${F(r.lead)}</b> | <b>${r.sd}</b></p><table><tr><th>#<th>Candidate<th>Party<th>Votes<th>% counted<th>% of ballots<th>Proj. %<th>Proj. votes<th>Behind leader<th>Can still win?</tr>

function entry(){const cs=db.ca.map((x,i)=>[x,i]).filter(([x])=>ui.ecid=='All'||x.cid==ui.ecid);
return`<h3>Contests (type level, state, office and TOTAL BALLOTS expected - everything else is automatic)</h3><div class="sc" style="max-height:38vh"><table><tr><th>ID<th>Level<th>State<th>Jurisdiction<th>Office<th>District<th>Total ballots<th></tr>
${db.co.map((x,i)=>`<tr><td>${x.id}<td>${sel(['Federal','State','County','City'],x.lvl,`data-t="co" data-i="${i}" data-f="lvl"`)}<td>${sel(db.st.map(s=>s.c),x.st,`data-t="co" data-i="${i}" data-f="st"`)}<td>${inp(x.jur,`class="w" data-t="co" data-i="${i}" data-f="jur"`)}<td>${sel(offs(),x.off,`data-t="co" data-i="${i}" data-f="off"`)}<td>${inp(x.dist,`data-t="co" data-i="${i}" data-f="dist" size=8`)}<td>${inp(x.bal,`data-t="co" data-i="${i}" data-f="bal" data-n=1`,'number')}<td><button class="x" data-del="co:${i}">x</button></tr>`).join('')}</table></div><button class="btn" data-add="co">+ Add contest</button>

function states(){const S=app();return`<div class="bar"><label>National margin 2020 (D-R)${inp(db.nat.a,'data-g="nat.a" data-n=1','number')}</label><label>National margin 2024${inp(db.nat.b,'data-g="nat.b" data-n=1','number')}</label></div><p class="sm">Add a state once here: it appears automatically on the map, in dropdowns, in the apportionment calculator and the district list. PVI = average of (state margin - national margin)/2 over both elections; type an official Cook PVI to override.</p>
<div class="sc"><table><tr><th>Code<th>Name<th>Population<th>Margin 2020<th>Margin 2024<th>House?<th>PVI override<th>PVI (auto)<th>Seats<th>EVs<th></tr>
${db.st.map((s,i)=>`<tr><td>${inp(s.c,`size=3 data-t="st" data-i="${i}" data-f="c"`)}<td>${inp(s.n,`class="w" data-t="st" data-i="${i}" data-f="n"`)}<td>${inp(s.p,`data-t="st" data-i="${i}" data-f="p" data-n=1`,'number')}<td>${inp(s.m20,`data-t="st" data-i="${i}" data-f="m20" data-n=1`,'number')}<td>${inp(s.m24,`data-t="st" data-i="${i}" data-f="m24" data-n=1`,'number')}<td><input type="checkbox" ${s.ap?'checked':''} data-t="st" data-i="${i}" data-f="ap"><td>${inp(s.ov,`data-t="st" data-i="${i}" data-f="ov" style="width:70px"`)}<td><b>${pl(pv(s))}</b><td>${S[s.c]||0}<td>${ev(S,s.c)}<td><button class="x" data-del="st:${i}">x</button></tr>`).join('')}</table></div><button class="btn" data-add="st">+ Add state</button>`}
function appt(){const S=app(),tot=Object.values(S).reduce((a,b)=>a+b,0),ds=[];db.st.forEach(s=>{const n=S[s.c]||0;for(let d=1;d<=n;d++)ds.push({code:s.c+'-'+(n==1?'AL':String(d).padStart(2,'0')),s})});
return`<div class="bar"><label>House size${inp(db.house,'data-g="house" data-n=1','number')}</label></div><p>Huntington-Hill apportionment: <b>${tot}</b> seats across ${db.st.filter(s=>s.ap).length} states. Districts below rebuild automatically.</p>
<div class="sc" style="max-height:30vh"><table><tr><th>State<th>Population<th>Seats<th>EVs</tr>${db.st.map(s=>`<tr><td>${E(s.n)}<td>${F(s.p)}<td>${S[s.c]||0}<td>${ev(S,s.c)}</tr>`).join('')}</table></div>
<h3>Districts (${ds.length}) - enter district margins for an exact PVI; otherwise the state PVI is used</h3><div class="sc" style="max-height:40vh"><table><tr><th>District<th>Margin 2020<th>Margin 2024<th>PVI<th>Basis</tr>
${ds.map(d=>{const m=db.dm[d.code]||{},ok=m.a!==''&&m.b!==''&&m.a!=null&&m.b!=null;return`<tr><td><b>${d.code}</b><td>${inp(m.a??'',`data-dm="${d.code}" data-k="a" style="width:80px"`,'number')}<td>${inp(m.b??'',`data-dm="${d.code}" data-k="b" style="width:80px"`,'number')}<td><b>${ok?pl(((+m.a-db.nat.a)+(+m.b-db.nat.b))/4):pl(pv(d.s))}</b><td class="sm">${ok?'Computed':'State estimate'}</tr>`}).join('')}</table></div>`}
function settings(){return`<h3>Scenario swing (points of vote share added to each party's candidates in every contest)</h3><div class="bar">${Object.keys(PN).map(k=>`<label>${k} - ${PN[k]}${inp(db.sw[k],`data-g="sw.${k}" data-n=1`,'number')}</label>`).join('')}</div>
<div class="bar"><label>'Too close to call' margin (pts)${inp(db.close,'data-g="close" data-n=1','number')}</label></div><label class="sm">Office list (comma separated)</label><br><input style="width:100%" value="${E(db.off)}" data-g="off"><p class="sm">Data is saved in this browser (localStorage). Use Export / Import in the header area below to back up or move it.</p>
<button class="btn" id="ex">Export JSON</button> <label class="btn">Import JSON<input type="file" id="im" hidden></label> <button class="btn" id="rs">Reset to sample data</button>`}
const TABS={Dashboard:dash,'Contest Results':results,'Data Entry':entry,States:states,'Apportionment & Districts':appt,Settings:settings};
function render(){R={};db.co.forEach(c=>R[c.id]=cc(c));$('#nav').innerHTML=Object.keys(TABS).map(t=>`<button class="${t==ui.tab?'on':''}" data-tab="${t}">${t}</button>`).join('');$('#app').innerHTML=TABS[ui.tab]()}
document.addEventListener('click',e=>{const t=e.target,g=k=>t.closest('['+k+']')?.getAttribute(k);if(g('data-tab')){ui.tab=g('data-tab');render()}
else if(g('data-go')){ui.cid=g('data-go');ui.tab='Dashboard';render()}
else if(g('data-del')){const[a,i]=g('data-del').split(':');if(a=='co'){const id=db.co[i].id;db.ca=db.ca.filter(x=>x.cid!=id)}db[a].splice(i,1);save();render()}
else if(g('data-add')){const a=g('data-add');if(a=='co'){const n=Math.max(0,...db.co.map(c=>+c.id.slice(1)))+1;db.co.push({id:'C'+String(n).padStart(3,'0'),lvl:'Federal',st:db.st[0]?.c||'',jur:'',off:offs()[0]||'',dist:'',bal:0})}
else if(a=='ca')db.ca.push({cid:ui.ecid!='All'?ui.ecid:db.co[0]?.id,name:'New Candidate',party:'D',inc:0,votes:0});else db.st.push({c:'XX',n:'New State',p:1000000,m20:0,m24:0,ap:true,ov:''});save();render()}
else if(t.id=='rs'){if(confirm('Reset all data to sample data?')){db=seed();save();render()}}
else if(t.id=='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='election-simulator.json';a.click()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.u){ui[d.u]=t.value;render()}
else if(d.t){const v=t.type=='checkbox'?t.checked:d.n?+t.value:t.value;if(d.t=='st'&&d.f=='c'){const o=db.st[d.i].c;db.co.forEach(c=>{if(c.st==o)c.st=v})}db[d.t][d.i][d.f]=v;save();render()}
else if(d.g){const p=d.g.split('.'),v=d.n?+t.value:t.value;if(p.length>1)db[p[0]][p[1]]=v;else db[p[0]]=v;save();render()}
else if(d.dm){(db.dm[d.dm]=db.dm[d.dm]||{a:'',b:''})[d.k]=t.value;save();render()}
else if(t.id=='im'){const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(x){alert('Invalid file')}};r.readAsText(t.files[0])}});
render();
</script></body></html>
